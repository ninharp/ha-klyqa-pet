rules:
  # Bronze
  action-setup:
    status: todo
    comment: >
      The three feeding-schedule actions are registered in async_setup_entry
      (and removed when the last entry unloads) rather than in async_setup,
      because they resolve a target device to a live coordinator and have
      nothing to validate against while no entry is loaded.
  appropriate-polling: done
  brands:
    status: done
    comment: >
      Since HA 2026.3's Brands Proxy API, custom integrations ship their own
      brand/ folder instead of submitting to home-assistant/brands (that repo
      no longer accepts custom-integration PRs). icon.png/icon@2x.png live in
      custom_components/klyqa_pet/brand/ and are served locally.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: todo
    comment: The feeding-schedule actions still need their README section.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No custom triggers.
  docs-conditions:
    status: exempt
    comment: No custom conditions.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to library events; data flows through the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No situation requires user intervention beyond the reauth flow.
  stale-devices: done
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
